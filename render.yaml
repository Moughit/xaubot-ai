services:
  - type: web
    name: xaubot-public-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://xaubot-ai-zeta.vercel.app,https://xaubot-ai-git-main-moughitrade.vercel.app
